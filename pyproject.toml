[project]
name = "chatter"
version = "0.1.0"
description = "Chat freely and securly on Chatter!"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiohttp==3.14.0",
    "flet>=0.86,<0.87",
    "python-socketio[asyncio_client]>=5.16,<6",
]

[tool.flet]
product = "Chatter"
org = "com.chatter2"
bundle_id = "com.chatter2.chatter"

[tool.flet.app]
module = "native_app.py"
exclude = [
    ".env",
    ".env.keys",
    ".env.local",
    ".git",
    ".github",
    "__pycache__",
    "backend",
    "run_server.py",
    "supabase",
]

[tool.flet.cleanup]
app = true
app_files = [".env*"]
